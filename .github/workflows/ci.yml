name: Axon CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux GCC / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version and release tag
        shell: bash
        run: bash scripts/check-release.sh
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libcurl4-openssl-dev libssl-dev
      - name: Validate native build
        shell: bash
        run: bash scripts/validate.sh "${{ matrix.config }}" -G Ninja -DAXON_WARNINGS_AS_ERRORS=ON
      - name: Validate native archive (not a public Linux release)
        if: matrix.config == 'Release'
        shell: bash
        env:
          AXON_PACKAGE_BUILD_DIR: ${{ github.workspace }}/build-validation
        run: bash scripts/package.sh -G Ninja -DAXON_WARNINGS_AS_ERRORS=ON
      - name: Upload validation archive
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-validation-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.config }}-logs-${{ github.run_id }}
          path: build-validation/Testing/Temporary/
          if-no-files-found: warn

  windows:
    name: Windows UCRT64 / ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
      - name: Check version and release tag
        run: bash scripts/check-release.sh
      - name: Validate Debug build
        if: matrix.config == 'Debug'
        run: bash scripts/validate.sh Debug -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DAXON_WARNINGS_AS_ERRORS=ON
      - name: Build and validate Windows portable
        if: matrix.config == 'Release'
        run: bash scripts/package.sh -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DAXON_WARNINGS_AS_ERRORS=ON
      - name: Upload Windows candidate (does not publish a release)
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-candidate-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.config }}-logs-${{ github.run_id }}
          path: |
            build-validation/Testing/Temporary/
            build-alpha/Testing/Temporary/
          if-no-files-found: warn

  macos:
    name: macOS Apple Clang / experimental
    runs-on: macos-15
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version and release tag
        run: bash scripts/check-release.sh
      - name: Install TLS fixture build dependency
        run: brew install openssl@3
      - name: Validate native build (no macOS package yet)
        run: bash scripts/validate.sh Release -DAXON_WARNINGS_AS_ERRORS=ON -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-experimental-logs-${{ github.run_id }}
          path: build-validation/Testing/Temporary/
          if-no-files-found: warn

  docker:
    name: Linux Docker / candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tested runtime image
        run: docker build --target runtime --tag axon-ci:local .
      - name: Run image as non-root
        run: |
          docker run --rm axon-ci:local version
          docker run --rm axon-ci:local test
          docker run --rm axon-ci:local run /opt/axon/share/axon/examples/validation/tasks.axon
