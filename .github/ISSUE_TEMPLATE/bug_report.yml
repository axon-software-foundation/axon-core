name: Bug report / Error
description: Report a reproducible problem in Axon Core.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Do not post credentials, personal data or private documents. Spanish and English are welcome."
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Include axon version output, OS, architecture, compiler and whether you used a downloaded ZIP or built from source.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal example and exact commands
      description: Include the smallest .axon example that reproduces the problem. Identify external services if required.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and logs
      description: Include the first error, full relevant diagnostics and exit code. Remove secrets.
    validations:
      required: true
